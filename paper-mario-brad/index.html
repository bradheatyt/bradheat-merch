<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#090909"><title>Paper Mario + Brad</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}#game{width:100vw;height:100dvh;background:#000}#shell{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 50% 28%,#3a1d13 0,#120b09 38%,#050505 78%)}.card{width:min(520px,100%);text-align:center}.pill{display:inline-block;border:1px solid #ffffff38;border-radius:999px;padding:6px 10px;font-size:11px;opacity:.85;margin-bottom:16px}h1{margin:0 0 10px;font-size:clamp(38px,10vw,64px);line-height:.9;letter-spacing:-.055em}p{margin:0 auto 20px;max-width:430px;line-height:1.4;color:#ffffffb8;font-size:14px}button{width:100%;min-height:66px;border:0;border-radius:18px;background:#fff;color:#050505;font-weight:900;font-size:21px;box-shadow:0 12px 35px #0009;touch-action:manipulation}button:disabled{opacity:.55}#status{min-height:42px;margin-top:14px;font-size:13px;line-height:1.35;color:#ffffffa8}#secondary{margin-top:12px;background:transparent;color:#ffffffaa;border:1px solid #ffffff30;box-shadow:none;min-height:46px;font-size:14px;display:none}#topStatus{position:fixed;left:0;right:0;top:env(safe-area-inset-top);z-index:20;padding:8px 12px;text-align:center;background:#000b;font-size:12px;display:none}input{display:none}</style></head><body><div id="game"></div><div id="topStatus"></div><div id="shell"><div class="card"><div class="pill">U.S. REV. 00 · BRAD v0.2</div><h1>PAPER MARIO<br>+ BRAD</h1><p>First visit only: choose <b>Paper_Mario_and_Brads_Adventure_US_v0.2.z64</b> from Files. It stays entirely on this iPhone. After that, this becomes one-tap Play / Resume.</p><input id="romPicker" type="file" accept=".z64,.n64,.v64,application/octet-stream"><button id="primary">CHECKING DEVICE…</button><button id="secondary">RE-IMPORT ROM</button><div id="status">Looking for your Brad build…</div></div></div><script>const MOD_SHA='c0d6101e5065ade97e01c4f6dba6ba70b2326672',SIZE=41943040,$=id=>document.getElementById(id),primary=$('primary'),secondary=$('secondary'),picker=$('romPicker'),status=$('status'),shell=$('shell'),topStatus=$('topStatus');let installed=false,launching=false;function msg(t){status.textContent=t}function hex(buf){return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function sha1(buf){return hex(await crypto.subtle.digest('SHA-1',buf))}function openDB(){return new Promise((ok,no)=>{const q=indexedDB.open('pm-brad-launcher',1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}async function getRom(){const db=await openDB();return new Promise((ok,no)=>{const q=db.transaction('files','readonly').objectStore('files').get('rom');q.onsuccess=()=>ok(q.result||null);q.onerror=()=>no(q.error)})}async function saveRom(v){const db=await openDB();return new Promise((ok,no)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(v,'rom');t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function refresh(){try{const r=await getRom();if(r&&r.byteLength===SIZE){installed=true;primary.textContent='PLAY / RESUME';secondary.style.display='block';msg('Brad v0.2 is installed locally on this iPhone.');return}}catch(e){console.error(e)}installed=false;primary.textContent='IMPORT BRAD ROM';secondary.style.display='none';msg('Choose the Brad v0.2 .z64 file from Files.')}async function importRom(file){primary.disabled=true;msg('Reading ROM…');try{const b=await file.arrayBuffer();if(b.byteLength!==SIZE)throw Error('Wrong file size. Choose the 40 MB Brad v0.2 U.S. ROM.');msg('Verifying Brad v0.2…');if(await sha1(b)!==MOD_SHA)throw Error('That is not the Brad v0.2 U.S. ROM.');await saveRom(b);try{await navigator.storage?.persist?.()}catch(e){}installed=true;primary.disabled=false;primary.textContent='PLAY NOW';secondary.style.display='block';msg('Installed locally. Starting…');launch()}catch(e){console.error(e);primary.disabled=false;primary.textContent='TRY AGAIN';msg(e.message||'Import failed.')}}async function launch(){if(launching)return;launching=true;primary.disabled=true;try{const b=await getRom();if(!b)throw Error('Import the Brad ROM first.');const u=URL.createObjectURL(new Blob([b],{type:'application/octet-stream'}));window.EJS_player='#game';window.EJS_core='n64';window.EJS_gameUrl=u;window.EJS_gameName='Paper Mario + Brad US v0.2';window.EJS_gameID=64001337;window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_startOnLoaded=true;window.EJS_volume=.8;window.EJS_threads=false;window.EJS_browserMode='mobile';window.EJS_controlScheme='n64';window.EJS_color='#fff';window.EJS_backgroundColor='#050505';window.EJS_startButtonName='PLAY PAPER MARIO + BRAD';window.EJS_onGameStart=()=>topStatus.style.display='none';shell.style.display='none';topStatus.style.display='block';topStatus.textContent='Loading N64 core…';const s=document.createElement('script');s.src='https://cdn.emulatorjs.org/stable/data/loader.js';s.onerror=()=>{shell.style.display='flex';topStatus.style.display='none';launching=false;primary.disabled=false;msg('EmulatorJS failed to load. Open this page in Safari and try again.')};document.body.appendChild(s);setTimeout(()=>{if(topStatus.style.display!=='none')topStatus.textContent='Still loading Paper Mario + Brad…'},8000)}catch(e){launching=false;primary.disabled=false;msg(e.message||'Could not start.')}}primary.addEventListener('click',()=>installed?launch():picker.click());secon
